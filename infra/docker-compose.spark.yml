# =============================================================================
# docker-compose.spark.yml
# -----------------------------------------------------------------------------
# Purpose : Apache Spark cluster + Livy REST API for distributed processing
# Module  : spark
#
# Usage:
#   ./up.sh spark
#
# Services:
#   spark-master : Cluster coordinator  (http://localhost:8080)
#   spark-worker : Task executor (replicas from config)
#   livy         : REST API for Spark job submission (http://localhost:8998)
#
# Config values (cores, memory, replicas) read from .env (symlinked from config/)
# Airflow submits jobs via: LivyOperator → Livy :8998 → Spark Master → Workers
#
# Volume paths use ${INFRA_HOST_PATH} for Docker-in-Docker compatibility.
# up.sh auto-resolves this to the host absolute path.
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Spark Master
  # Cluster coordinator — distributes tasks to workers.
  # UI: http://localhost:8080
  # ---------------------------------------------------------------------------
  spark-master:
    image: apache/spark:3.5.1
    container_name: spark-master
    hostname: spark-master
    ports:
      - "8080:8080"                              # Spark Master Web UI
      - "7077:7077"                              # Spark cluster communication
      - "4040:4040"                              # Spark application UI
    volumes:
      - ${INFRA_HOST_PATH:-.}/../data:/opt/spark/data
      - ${INFRA_HOST_PATH:-.}/../pipelines:/opt/spark/pipelines
      - ${INFRA_HOST_PATH:-.}/../pipelines/matching-insights/notebooks:/opt/spark/notebooks
      - ${INFRA_HOST_PATH:-.}/../pipelines/matching-insights/config:/opt/spark/config
      - ${INFRA_HOST_PATH:-.}/jars:/opt/spark/jars/custom
    environment:
      - SPARK_NO_DAEMONIZE=true
    command:
      ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]

  # ---------------------------------------------------------------------------
  # Spark Worker
  # Executes Spark tasks distributed by the master.
  # Replicas, cores, and memory configured via .env.
  # ---------------------------------------------------------------------------
  spark-worker:
    build: ./spark-worker
    user: root
    depends_on:
      - spark-master
    volumes:
      - ${INFRA_HOST_PATH:-.}/../data:/opt/spark/data
      - ${INFRA_HOST_PATH:-.}/../pipelines:/opt/spark/pipelines
      - ${INFRA_HOST_PATH:-.}/../pipelines/matching-insights/notebooks:/opt/spark/notebooks
      - ${INFRA_HOST_PATH:-.}/../pipelines/matching-insights/config:/opt/spark/config
      - ${INFRA_HOST_PATH:-.}/jars:/opt/spark/jars/custom
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_WORKER_CORES=${SPARK_WORKER_CORES:-1}
      - SPARK_WORKER_MEMORY=${SPARK_WORKER_MEMORY:-2g}
      - SPARK_NO_DAEMONIZE=true
      - PYSPARK_PYTHON=python3.11
    deploy:
      replicas: ${SPARK_WORKER_REPLICAS:-1}
    command:
      [
        "/opt/spark/bin/spark-class",
        "org.apache.spark.deploy.worker.Worker",
        "spark://spark-master:7077",
      ]

  # ---------------------------------------------------------------------------
  # Apache Livy
  # REST API for submitting Spark jobs from Airflow (LivyOperator).
  # API: http://localhost:8998
  # livy.conf is baked into the image (see livy/Dockerfile)
  # ---------------------------------------------------------------------------
  livy:
    build: ./livy
    container_name: livy
    ports:
      - "8998:8998"
    environment:
      - SPARK_HOME=/opt/spark
    volumes:
      - ${INFRA_HOST_PATH:-.}/../pipelines:/opt/spark/pipelines
      - ${INFRA_HOST_PATH:-.}/../pipelines/matching-insights/notebooks:/opt/spark/notebooks
      - ${INFRA_HOST_PATH:-.}/../data:/opt/spark/data
      - ${INFRA_HOST_PATH:-.}/../pipelines/matching-insights/config:/opt/spark/config
    depends_on:
      - spark-master

networks:
  default:
    name: giljobi-network
    external: true
