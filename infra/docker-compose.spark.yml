# =============================================================================
# docker-compose.spark.yml
# -----------------------------------------------------------------------------
# Purpose : Apache Spark cluster + Livy REST API for distributed processing
# Module  : spark
#
# Usage:
#   ./up.sh spark
#
# Services:
#   spark-master : Cluster coordinator  (http://localhost:8080)
#   spark-worker : Task executor (replicas from config)
#   livy         : REST API for Spark job submission (http://localhost:8998)
#
# Config values (cores, memory, replicas) read from .env (symlinked from config/)
# Airflow submits jobs via: LivyOperator → Livy :8998 → Spark Master → Workers
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Spark Master
  # Cluster coordinator — distributes tasks to workers.
  # UI: http://localhost:8080
  # ---------------------------------------------------------------------------
  spark-master:
    image: apache/spark:3.5.1
    container_name: spark-master
    hostname: spark-master
    ports:
      - "8080:8080"                              # Spark Master Web UI
      - "7077:7077"                              # Spark cluster communication
      - "4040:4040"                              # Spark application UI
    volumes:
      - ../data:/opt/spark/data
      - ../pipelines/matching-insights/notebooks:/opt/spark/notebooks
      - ../pipelines/matching-insights/config:/opt/spark/config
      - ./jars:/opt/spark/jars/custom
      - ./scripts/spark-entrypoint.sh:/opt/spark/scripts/entrypoint.sh
    environment:
      - SPARK_NO_DAEMONIZE=true
    entrypoint: ["/bin/bash", "/opt/spark/scripts/entrypoint.sh"]
    command:
      ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]

  # ---------------------------------------------------------------------------
  # Spark Worker
  # Executes Spark tasks distributed by the master.
  # Replicas, cores, and memory configured via .env.
  # ---------------------------------------------------------------------------
  spark-worker:
    build: ./spark-worker
    user: root
    depends_on:
      - spark-master
    volumes:
      - ../data:/opt/spark/data
      - ../pipelines/matching-insights/notebooks:/opt/spark/notebooks
      - ../pipelines/matching-insights/config:/opt/spark/config
      - ./jars:/opt/spark/jars/custom
      - ./scripts/spark-entrypoint.sh:/opt/spark/scripts/entrypoint.sh
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_WORKER_CORES=${SPARK_WORKER_CORES:-1}
      - SPARK_WORKER_MEMORY=${SPARK_WORKER_MEMORY:-2g}
      - SPARK_NO_DAEMONIZE=true
      - PYSPARK_PYTHON=python3.11
    deploy:
      replicas: ${SPARK_WORKER_REPLICAS:-1}
    entrypoint: ["/bin/bash", "/opt/spark/scripts/entrypoint.sh"]
    command:
      [
        "/opt/spark/bin/spark-class",
        "org.apache.spark.deploy.worker.Worker",
        "spark://spark-master:7077",
      ]

  # ---------------------------------------------------------------------------
  # Apache Livy
  # REST API for submitting Spark jobs from Airflow (LivyOperator).
  # API: http://localhost:8998
  # ---------------------------------------------------------------------------
  livy:
    build: ./livy
    container_name: livy
    ports:
      - "8998:8998"
    environment:
      - SPARK_HOME=/opt/spark
    volumes:
      - ../pipelines/matching-insights/notebooks:/opt/spark/notebooks
      - ../data:/opt/spark/data
      - ../pipelines/matching-insights/config:/opt/spark/config
      - ./livy.conf:/opt/livy/conf/livy.conf
    depends_on:
      - spark-master

networks:
  default:
    name: giljobi-network
    external: true
