#cloud-config
# =============================================================================
# cloud-init.yaml — VM bootstrap (runs once on first boot)
# =============================================================================
# Variables injected by Terraform templatefile():
#   ${github_pat}                  — GitHub PAT for private repo clone
#   ${airflow_admin_user}          — Airflow web UI username
#   ${airflow_admin_password}      — Airflow web UI password
#   ${neon_skill_demand_db_url}    — Neon DB connection string
#   ${databricks_host}             — Databricks workspace URL
#   ${databricks_token}            — Databricks PAT token
#   ${storage_connection_string}   — Azure Blob Storage connection string
#   ${git_branch}                  — Git branch to checkout
# =============================================================================

package_update: true
package_upgrade: true

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - git
  - jq

runcmd:
  # ── Docker CE ──────────────────────────────────────────────
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
  - usermod -aG docker azureuser

  # Airflow container needs docker.sock access (660 default blocks airflow user)
  - chmod 666 /var/run/docker.sock

  # Persist docker.sock permissions across Docker daemon restarts
  - mkdir -p /etc/systemd/system/docker.service.d
  - |
    cat > /etc/systemd/system/docker.service.d/override.conf << 'SYSD'
    [Service]
    ExecStartPost=/bin/chmod 666 /var/run/docker.sock
    SYSD
  - systemctl daemon-reload

  # ── blobfuse2 install (must come before mount) ──────────────
  - curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor -o /usr/share/keyrings/microsoft-archive-keyring.gpg
  - echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-archive-keyring.gpg] https://packages.microsoft.com/repos/microsoft-ubuntu-$(lsb_release -cs)-prod $(lsb_release -cs) main" > /etc/apt/sources.list.d/microsoft.list
  - apt-get update
  - apt-get install -y blobfuse2

  # ── Clone repo (using GitHub PAT for private repo) ─────────
  - su - azureuser -c "git clone https://${github_pat}@github.com/JindoKimKor/GILJOBI.git /home/azureuser/giljobi"
  - su - azureuser -c "cd /home/azureuser/giljobi && git checkout ${git_branch}"

  # ── blobfuse2 mount (Azure Blob Storage → /home/azureuser/giljobi/data) ──
  # Pipeline data (raw CSV, processed parquet, checkpoints) lives on Blob.
  # Mounting to /home/azureuser/giljobi/data/ means existing code paths
  # (/opt/airflow/data/ in container) write directly to Blob Storage.
  # Data survives VM destroy — only infrastructure is disposable.
  - mkdir -p /home/azureuser/giljobi/data
  - mkdir -p /tmp/blobfuse2-cache
  - |
    cat > /home/azureuser/blobfuse2-config.yaml << 'BLOBEOF'
    allow-other: true
    logging:
      type: syslog
      level: log_warning
    components:
      - libfuse
      - file_cache
      - attr_cache
      - azstorage
    libfuse:
      attribute-expiration-sec: 120
      entry-expiration-sec: 120
      negative-entry-expiration-sec: 60
    file_cache:
      path: /tmp/blobfuse2-cache
      timeout-sec: 120
      max-size-mb: 4096
    attr_cache:
      timeout-sec: 7200
    azstorage:
      type: block
      account-name: ${storage_account_name}
      account-key: ${storage_account_key}
      endpoint: https://${storage_account_name}.blob.core.windows.net
      mode: key
      container: pipeline-data
    BLOBEOF
  - blobfuse2 mount /home/azureuser/giljobi/data --config-file=/home/azureuser/blobfuse2-config.yaml
  # Create subdirectories on Blob (first access creates them)
  - mkdir -p /home/azureuser/giljobi/data/raw/skill-demand /home/azureuser/giljobi/data/raw/market-trend /home/azureuser/giljobi/data/processed
  - chmod -R 777 /home/azureuser/giljobi/data/

  # ── Persist blobfuse2 mount across VM reboots ──────────────
  # fstab entry ensures mount survives VM stop/start
  - echo "blobfuse2 /home/azureuser/giljobi/data fuse3 --config-file=/home/azureuser/blobfuse2-config.yaml,_netdev,allow_other 0 0" >> /etc/fstab

  # Airflow logs directory — scheduler/worker need write access
  # Logs stay on local disk (not Blob) — high frequency small writes
  - mkdir -p /home/azureuser/giljobi/infra/logs
  - chmod -R 777 /home/azureuser/giljobi/infra/logs

  # ── Generate .env for Airflow Azure compose ────────────────
  # All secrets injected by Terraform — never hardcoded
  - |
    cat > /home/azureuser/giljobi/infra/.env << 'ENVEOF'
    # Auto-generated by Terraform cloud-init — do not edit manually
    # Airflow metadata DB
    AIRFLOW_DB_USER=airflow
    AIRFLOW_DB_PASSWORD=airflow
    AIRFLOW_DB_NAME=airflow
    AIRFLOW_ADMIN_USER=${airflow_admin_user}
    AIRFLOW_ADMIN_PASSWORD=${airflow_admin_password}
    AIRFLOW_WORKER_REPLICAS=1
    AIRFLOW_WORKER_MEMORY=2g

    # Azure Databricks connection (auto-generated PAT)
    AIRFLOW_CONN_DATABRICKS_DEFAULT=databricks://${databricks_host}?token=${databricks_token}

    # Neon DB (skill-demand)
    SKILL_DEMAND_DB_CONN=${neon_skill_demand_db_url}

    # Azure Blob Storage
    AZURE_STORAGE_CONNECTION_STRING=${storage_connection_string}

    # Pipeline flags (Azure mode — no local Docker infra)
    MANAGE_PIPELINE_DB=false
    MANAGE_SPARK=false
    GILJOBI_ENV=azure
    ENVEOF
  - chown azureuser:azureuser /home/azureuser/giljobi/infra/.env

  # ── Auto-start Airflow (Azure mode) ────────────────────────
  - su - azureuser -c "cd /home/azureuser/giljobi/infra && chmod +x up-azure.sh && bash up-azure.sh --build"

  # ── Done marker ────────────────────────────────────────────
  - echo "cloud-init complete" > /home/azureuser/.cloud-init-done
