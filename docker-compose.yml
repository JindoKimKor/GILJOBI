services:
  postgres:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: giljobi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  spark-master:
    image: apache/spark:latest
    container_name: spark-master
    hostname: spark-master
    depends_on:
      - postgres
    ports:
      - "8080:8080"
      - "7077:7077"
      - "4040:4040"
    volumes:
      - ./data:/opt/spark/data
      - ./notebooks:/opt/spark/notebooks
      - ./config:/opt/spark/config
      - ./jars:/opt/spark/jars/custom
      - ./scripts/spark-entrypoint.sh:/opt/spark/scripts/entrypoint.sh
    environment:
      - SPARK_NO_DAEMONIZE=true
    entrypoint: ["/bin/bash", "/opt/spark/scripts/entrypoint.sh"]
    command:
      ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]

  spark-worker-1:
    image: apache/spark:latest
    container_name: spark-worker-1
    depends_on:
      - spark-master
      - postgres
    ports:
      - "8081:8081"
    volumes:
      - ./data:/opt/spark/data
      - ./notebooks:/opt/spark/notebooks
      - ./config:/opt/spark/config
      - ./jars:/opt/spark/jars/custom
      - ./scripts/spark-entrypoint.sh:/opt/spark/scripts/entrypoint.sh
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_WORKER_CORES=1
      - SPARK_WORKER_MEMORY=2g
      - SPARK_NO_DAEMONIZE=true
    entrypoint: ["/bin/bash", "/opt/spark/scripts/entrypoint.sh"]
    command:
      [
        "/opt/spark/bin/spark-class",
        "org.apache.spark.deploy.worker.Worker",
        "spark://spark-master:7077",
      ]

  spark-worker-2:
    image: apache/spark:latest
    container_name: spark-worker-2
    depends_on:
      - spark-master
      - postgres
    ports:
      - "8082:8081"
    volumes:
      - ./data:/opt/spark/data
      - ./notebooks:/opt/spark/notebooks
      - ./config:/opt/spark/config
      - ./jars:/opt/spark/jars/custom
      - ./scripts/spark-entrypoint.sh:/opt/spark/scripts/entrypoint.sh
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_WORKER_CORES=1
      - SPARK_WORKER_MEMORY=2g
      - SPARK_NO_DAEMONIZE=true
    entrypoint: ["/bin/bash", "/opt/spark/scripts/entrypoint.sh"]
    command:
      [
        "/opt/spark/bin/spark-class",
        "org.apache.spark.deploy.worker.Worker",
        "spark://spark-master:7077",
      ]

volumes:
  postgres_data:
